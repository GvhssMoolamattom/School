<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | GVHSS Moolamattom</title>
    <style>
        :root { --primary-color: #2C3E50; --accent-color: #FF6B6B; --button-color: #4ECDC4; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .login-box {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            border-radius: 20px; padding: 3rem; width: 100%; max-width: 400px;
            text-align: center; border-top: 8px solid var(--primary-color);
        }

        .login-box h2 { color: var(--primary-color); margin-top: 0; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { font-weight: bold; color: var(--primary-color); display: block; margin-bottom: 5px; }
        input {
            width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #ddd;
            box-sizing: border-box; font-size: 1rem;
        }
        input:focus { outline: none; border-color: var(--button-color); }
        
        button {
            width: 100%; background: var(--primary-color); color: white; padding: 15px;
            border: none; border-radius: 30px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s; margin-top: 10px;
        }
        button:hover { background: var(--button-color); transform: translateY(-2px); }

        #error-msg { color: red; font-weight: bold; margin-top: 15px; display: none; }
        .back-link { display: block; margin-top: 20px; color: var(--primary-color); text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔒 Admin Portal</h2>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        
        <button onclick="attemptLogin()">Login</button>
        <p id="error-msg">Incorrect Username or Password!</p>
        
        <a href="index.html" class="back-link">⬅ Back to Home</a>
    </div>

    <script>
        function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Checking the exact credentials you requested
            if(user === "gvhss@mltm" && pass === "gvhss12345") {
                // Redirect to the admin dashboard
                window.location.href = "admin.html";
            } else {
                // Show error message
                document.getElementById('error-msg').style.display = 'block';
                setTimeout(() => { document.getElementById('error-msg').style.display = 'none'; }, 3000);
            }
        }

        // Allow pressing "Enter" to log in
        document.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                attemptLogin();
            }
        });
    </script>
</body>
</html>
