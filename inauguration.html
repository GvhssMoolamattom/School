<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASS LAUNCH | GVHSS Moolamattom</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- MASS CINEMATIC PALETTE --- */
        :root {
            --bg-pure: #030303;
            --bg-glow: #1a0000;
            --neon-red: #ff003c;
            --gold: #ffb300;
            --text-main: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-pure);
            background-image: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-pure) 100%);
            color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center; overflow: hidden;
        }

        /* --- CINEMATIC EMBERS --- */
        #particle-container, #fireworks-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .ember {
            position: absolute; bottom: -20px; border-radius: 50%;
            background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red), 0 0 20px var(--gold);
            will-change: transform, opacity; animation: floatUp cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) translateX(50px) scale(0); opacity: 0; }
        }

        /* --- MASS SCREEN SHAKE --- */
        .mass-shake { animation: intenseShake 0.5s cubic-bezier(.36,.07,.19,.97) both infinite; }
        @keyframes intenseShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-10px, 10px) rotate(-1deg); }
            50% { transform: translate(10px, -10px) rotate(1deg); }
            75% { transform: translate(-10px, -10px) rotate(-1deg); }
        }

        /* --- PRE-LAUNCH VIBE --- */
        #pre-launch { position: relative; z-index: 10; padding: 2rem; max-width: 900px; width: 95%; }
        
        .alert-badge {
            display: inline-block; color: var(--neon-red); border: 2px solid var(--neon-red);
            padding: 8px 30px; border-radius: 4px; font-weight: 900; font-size: 1rem; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.3), inset 0 0 10px rgba(255, 0, 60, 0.2);
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 15px rgba(255,0,60,0.3); } 50% { box-shadow: 0 0 30px rgba(255,0,60,0.8); } }

        .mass-title { font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 900; color: white; text-transform: uppercase; line-height: 1; margin: 0 0 10px 0; letter-spacing: -2px; text-shadow: 0 10px 30px rgba(0,0,0,0.8);}
        .mass-subtitle { font-size: clamp(1.2rem, 3vw, 2rem); font-weight: 700; color: var(--gold); letter-spacing: 10px; text-transform: uppercase; margin-bottom: 60px; }

        /* HEARTBEAT LAUNCH BUTTON */
        .mass-btn {
            background: var(--neon-red); color: white; border: none; padding: 20px 60px;
            font-size: 2rem; font-weight: 900; font-family: 'Montserrat', sans-serif;
            text-transform: uppercase; letter-spacing: 4px; cursor: pointer;
            box-shadow: 0 15px 40px rgba(255, 0, 60, 0.5); border-radius: 4px;
            transition: 0.2s; position: relative; overflow: hidden;
            animation: heartbeat 1.5s infinite;
        }
        .mass-btn:hover { animation: none; transform: scale(1.1); box-shadow: 0 20px 60px rgba(255, 0, 60, 0.8); background: white; color: var(--neon-red);}
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.05); box-shadow: 0 0 50px rgba(255,0,60,0.8); }
            30% { transform: scale(1); }
            45% { transform: scale(1.05); box-shadow: 0 0 50px rgba(255,0,60,0.8); }
            60% { transform: scale(1); }
        }

        /* --- COUNTDOWN (AGGRESSIVE) --- */
        #countdown-screen { display: none; z-index: 10; position: relative; }
        .danger-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: clamp(250px, 50vw, 400px); height: clamp(250px, 50vw, 400px);
            border: 8px solid transparent; border-top-color: var(--neon-red); border-bottom-color: var(--gold);
            border-radius: 50%; animation: spinFast 1s linear infinite; pointer-events: none;
        }
        @keyframes spinFast { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        
        .countdown-number { font-size: clamp(12rem, 35vw, 30rem); font-weight: 900; color: white; text-shadow: 0 0 50px var(--neon-red); margin: 0; line-height: 1; z-index: 2; position: relative;}
        .slam-anim { animation: slam 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes slam { 0% { transform: scale(5); opacity: 0; } 50% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.8); opacity: 0; } }

        #flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 9999; opacity: 0; pointer-events: none; }

        /* --- POST LAUNCH REVEAL --- */
        #post-launch { display: none; z-index: 10; width: 100%; max-width: 1000px; padding: 20px; }
        
        .reveal-box {
            background: rgba(10, 0, 0, 0.8); border: 2px solid var(--neon-red); border-top: 10px solid var(--neon-red);
            padding: 50px 30px; box-shadow: 0 20px 50px rgba(255, 0, 60, 0.2);
            position: relative; overflow: hidden;
        }
        
        /* Reveal Staggering */
        .rl-1, .rl-2, .rl-3, .rl-4 { opacity: 0; transform: translateY(40px); }
        .show-reveal .rl-1 { animation: slideUp 0.6s ease forwards 0.2s; }
        .show-reveal .rl-2 { animation: slideUp 0.6s ease forwards 0.6s; }
        .show-reveal .rl-3 { animation: slideUp 0.6s ease forwards 1s; }
        .show-reveal .rl-4 { animation: slideUp 0.6s ease forwards 1.4s; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .final-title { font-size: clamp(2rem, 5vw, 4.5rem); font-weight: 900; color: white; text-transform: uppercase; margin: 0 0 10px 0; letter-spacing: -1px; text-shadow: 0 0 20px rgba(255,255,255,0.3);}
        .final-subtitle { font-size: 1.5rem; color: var(--gold); font-weight: 900; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 40px;}
        
        .launched-by { color: #888; font-size: 1rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 10px;}
        .leader-names { font-size: 1.5rem; color: white; font-weight: 900; text-transform: uppercase; border-bottom: 2px solid #333; padding-bottom: 20px; margin-bottom: 30px;}

        .enter-btn {
            display: inline-block; background: transparent; color: var(--neon-red); border: 3px solid var(--neon-red);
            padding: 15px 40px; font-size: 1.2rem; font-weight: 900; text-decoration: none; text-transform: uppercase;
            letter-spacing: 3px; transition: 0.3s;
        }
        .enter-btn:hover { background: var(--neon-red); color: white; box-shadow: 0 0 30px rgba(255,0,60,0.6); transform: scale(1.05);}

        /* Firework Sparkles */
        .fw-spark { position: absolute; width: 6px; height: 20px; border-radius: 4px; animation: fwExplode 1s ease-out forwards; will-change: transform, opacity; }
        @keyframes fwExplode { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }

    </style>
</head>
<body>

    <audio id="launchMusic" src="assets/bg.mp3" preload="auto"></audio>
    <audio id="crackerSound" src="assets/cracker.mp3" preload="auto"></audio>

    <div id="particle-container"></div>
    <div id="fireworks-container"></div>
    <div id="flash"></div>

    <!-- STAGE 1: PRE-LAUNCH -->
    <div id="pre-launch">
        <div class="alert-badge">System Ready</div>
        <h1 class="mass-title">GVHSS Moolamattom</h1>
        <div class="mass-subtitle">Digital Hub</div>
        <button class="mass-btn" onclick="startLaunch()">Launch</button>
    </div>

    <!-- STAGE 2: COUNTDOWN -->
    <div id="countdown-screen">
        <div class="danger-ring"></div>
        <p class="countdown-number" id="timer-text">10</p>
    </div>

    <!-- STAGE 3: POST LAUNCH REVEAL -->
    <div id="post-launch">
        <div class="reveal-box" id="revealBox">
            <div class="rl-1">
                <h2 class="final-title">GVHSS Moolamattom</h2>
                <div class="final-subtitle">Digital Hub Officially Active</div>
            </div>
            
            <div class="rl-2">
                <div class="launched-by">Inaugurated By</div>
                <div class="leader-names">
                    Sri. Suresh Kumar C G <span style="color:var(--neon-red); font-size:1rem;">(Principal)</span><br>
                    <span style="font-size: 1rem; color: #555;">&amp;</span><br>
                    Smt. Sreekala P <span style="color:var(--neon-red); font-size:1rem;">(Headmistress)</span>
                </div>
            </div>
            
            <div class="rl-3">
                <p style="color: #aaa; margin-bottom: 40px; font-weight: 600;">Special Thanks to our Former Principal, Smt. Nisa K.</p>
            </div>
            
            <div class="rl-4">
                <a href="index.html" class="enter-btn">Enter Hub</a>
            </div>
        </div>
    </div>

    <script>
        // Cinematic Embers
        const particleContainer = document.getElementById('particle-container');
        for (let i = 0; i < 40; i++) {
            let ember = document.createElement('div');
            ember.classList.add('ember');
            let size = Math.random() * 6 + 2; 
            ember.style.width = size + 'px';
            ember.style.height = size + 'px';
            ember.style.left = (Math.random() * 100) + 'vw';
            ember.style.animationDuration = (Math.random() * 5 + 3) + 's';
            ember.style.animationDelay = (Math.random() * 3) + 's';
            
            // Random colors between Gold, Orange, and Red
            let colors = ['#ff003c', '#ff5500', '#ffb300'];
            ember.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            particleContainer.appendChild(ember);
        }

        function startLaunch() {
            const bgMusic = document.getElementById('launchMusic');
            bgMusic.play().catch(e => console.log("Audio play blocked."));
            
            document.getElementById('pre-launch').style.display = 'none';
            document.getElementById('countdown-screen').style.display = 'block';
            
            let count = 10;
            const timerText = document.getElementById('timer-text');
            timerText.classList.add('slam-anim');

            let countdownInterval = setInterval(() => {
                count--;
                if(count > 0) {
                    timerText.classList.remove('slam-anim');
                    void timerText.offsetWidth; // Trigger reflow
                    timerText.innerText = count;
                    
                    // Change color to intense red for last 3 seconds
                    if(count <= 3) { timerText.style.color = 'var(--neon-red)'; }
                    
                    timerText.classList.add('slam-anim');
                } else {
                    clearInterval(countdownInterval);
                    timerText.classList.remove('slam-anim');
                    void timerText.offsetWidth;
                    
                    timerText.innerText = "FIRE!";
                    timerText.style.fontSize = "clamp(6rem, 20vw, 15rem)";
                    timerText.classList.add('slam-anim');
                    
                    // Add mass shake to body
                    document.body.classList.add('mass-shake');

                    setTimeout(() => { triggerLaunchFinale(bgMusic); }, 800); 
                }
            }, 1000); 
        }

        function triggerLaunchFinale(bgMusic) {
            bgMusic.pause();
            bgMusic.currentTime = 0;
            document.getElementById('crackerSound').play().catch(e => console.log("Audio blocked."));

            document.getElementById('countdown-screen').style.display = 'none';
            
            // Extreme Flash
            const flash = document.getElementById('flash');
            flash.style.opacity = '1';
            flash.style.transition = 'opacity 0.05s ease-in';

            launchMassFireworks();

            setTimeout(() => {
                document.body.classList.remove('mass-shake'); // Stop shaking
                flash.style.transition = 'opacity 2s ease-out';
                flash.style.opacity = '0';
                
                const postLaunch = document.getElementById('post-launch');
                postLaunch.style.display = 'block';
                
                // Trigger reveal animations
                document.getElementById('revealBox').classList.add('show-reveal');
            }, 800); 
        }

        function launchMassFireworks() {
            const fwContainer = document.getElementById('fireworks-container');
            const fwColors = ['#ff003c', '#ffb300', '#ffffff']; // Red, Gold, White
            
            for(let b = 0; b < 25; b++) { // More bursts
                setTimeout(() => {
                    let startX = Math.random() * 100;
                    let startY = Math.random() * 60 + 20; 
                    let burstColor = fwColors[Math.floor(Math.random() * fwColors.length)];
                    
                    // Background flashing effect
                    if(b % 4 === 0) {
                        document.body.style.backgroundColor = "#330000";
                        setTimeout(() => { document.body.style.backgroundColor = "var(--bg-pure)"; }, 100);
                    }
                    
                    let frag = document.createDocumentFragment();
                    for(let s = 0; s < 40; s++) { // More sparks per burst
                        let spark = document.createElement('div');
                        spark.classList.add('fw-spark');
                        spark.style.left = startX + 'vw';
                        spark.style.bottom = startY + 'vh';
                        spark.style.backgroundColor = burstColor;
                        spark.style.boxShadow = `0 0 15px ${burstColor}`;
                        
                        let angle = Math.random() * Math.PI * 2;
                        let distance = Math.random() * 400 + 100; // Shoot further
                        spark.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
                        spark.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
                        
                        frag.appendChild(spark);
                        setTimeout(() => { spark.remove(); }, 1000);
                    }
                    fwContainer.appendChild(frag); 
                }, b * 150); // Faster bursts
            }
        }
    </script>
</body>
</html>
