<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Terminal | GVHSS Moolamattom</title>
    <style>
        /* --- OLD SCHOOL CRT TERMINAL THEME --- */
        :root {
            --term-green: #00FF41;
            --term-bg: #000000;
            --term-dim: #008F11;
        }

        body {
            background-color: var(--term-bg);
            color: var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Subtle scanline effect overlay */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin-top: 2rem;
            z-index: 10;
        }

        h2 {
            border-bottom: 2px dashed var(--term-green);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Form & Button Styling */
        input, textarea, button {
            background-color: var(--term-bg);
            color: var(--term-green);
            border: 1px solid var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
            text-shadow: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 10px var(--term-green);
        }

        button {
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
            width: auto;
            padding: 10px 30px;
        }

        button:hover {
            background-color: var(--term-green);
            color: var(--term-bg);
        }

        .warning-btn {
            border-color: #FF0000;
            color: #FF0000;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }
        .warning-btn:hover {
            background-color: #FF0000;
            color: var(--term-bg);
        }

        /* Suggestion Box */
        .suggestion-box {
            border: 1px dashed var(--term-dim);
            padding: 15px;
            margin-bottom: 15px;
        }
        .suggestion-box h4 {
            margin: 0 0 5px 0;
            color: #ffffff;
        }
        .date {
            float: right;
            font-size: 0.8rem;
            color: var(--term-dim);
        }

        nav {
            width: 100%;
            padding: 15px;
            border-bottom: 2px solid var(--term-green);
            text-align: left;
            box-sizing: border-box;
            z-index: 10;
        }
        nav a {
            color: var(--term-green);
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            background-color: var(--term-green);
            color: var(--term-bg);
        }
        
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">[ EXIT SYSTEM (LOGOUT) ]</a>
        <span style="float: right;">SYS.ADMIN_TERMINAL_V1.0</span>
    </nav>

    <div class="container">
        
        <h2 class="blink">>>> SYSTEM ACCESS GRANTED</h2>

        <div style="margin-bottom: 40px;">
            <h3>[ DIRECTIVE: UPDATE NOTICES ]</h3>
            <p>Input data using standard HTML formatting (&lt;li&gt;Notice&lt;/li&gt;).</p>
            
            <label>> HIGH_SCHOOL_DATA_STREAM:</label>
            <textarea id="hsNotices" rows="4"></textarea>
            
            <label style="display:block; margin-top:15px;">> VHSE_DATA_STREAM:</label>
            <textarea id="vhseNotices" rows="4"></textarea>
            
            <br>
            <button onclick="saveNotices()">[ EXECUTE SAVE ]</button>
            <span id="save-msg" style="margin-left: 15px; display: none;" class="blink">DATA UPLOADED SUCCESSFULLY.</span>
        </div>

        <div>
            <h3>[ DIRECTIVE: READ INBOX ]</h3>
            <div id="suggestion-container">
                </div>
            <br>
            <button onclick="clearSuggestions()" class="warning-btn">[ PURGE ALL SUGGESTIONS ]</button>
        </div>

    </div>

    <script>
        // Load data as soon as the page opens
        document.addEventListener("DOMContentLoaded", function() {
            loadNotices();
            loadSuggestions();
        });

        function saveNotices() {
            const hs = document.getElementById('hsNotices').value;
            const vhse = document.getElementById('vhseNotices').value;
            
            localStorage.setItem('hs_notices', hs);
            localStorage.setItem('vhse_notices', vhse);

            document.getElementById('save-msg').style.display = 'inline';
            setTimeout(() => { document.getElementById('save-msg').style.display = 'none'; }, 2000);
        }

        function loadNotices() {
            document.getElementById('hsNotices').value = localStorage.getItem('hs_notices') || "<li><strong>Upcoming:</strong> Little Kites Coding Camp registrations open.</li><li><strong>August 25:</strong> First Terminal Examination begins.</li>";
            document.getElementById('vhseNotices').value = localStorage.getItem('vhse_notices') || "<li><strong>Upcoming:</strong> OJT schedules for Web Developer batch released.</li><li><strong>August 25:</strong> First Terminal Examination begins.</li>";
        }

        function loadSuggestions() {
            const container = document.getElementById('suggestion-container');
            const suggestions = JSON.parse(localStorage.getItem('school_suggestions')) || [];

            if(suggestions.length === 0) {
                container.innerHTML = "<p>INBOX EMPTY. NO NEW SUGGESTIONS.</p>";
                return;
            }

            container.innerHTML = ""; 
            suggestions.forEach(s => {
                container.innerHTML += `
                    <div class="suggestion-box">
                        <span class="date">${s.date}</span>
                        <h4>FROM: ${s.parent} (STUDENT_ID: ${s.student})</h4>
                        <p>> "${s.text}"</p>
                    </div>
                `;
            });
        }

        function clearSuggestions() {
            if(confirm("WARNING: Are you sure you want to permanently delete all parent suggestions?")) {
                localStorage.removeItem('school_suggestions');
                loadSuggestions();
            }
        }
    </script>
</body>
</html>
