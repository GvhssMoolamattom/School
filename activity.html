<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity | GVHSS Moolamattom</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0f172a;          
            --accent: #f43f5e;           
            --bg-body: #f1f5f9;          
            --card-bg: #ffffff;          
            --text-dark: #1e293b;        
            --text-muted: #64748b;       
            --shadow-soft: 0 10px 25px -5px rgba(0,0,0,0.05);
            --border-radius: 16px;
        }

        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; line-height: 1.6; color: var(--text-dark); background-color: var(--bg-body); overflow-x: hidden; }

        .top-bar { position: fixed; top: clamp(20px, 4vw, 30px); right: clamp(20px, 5vw, 60px); z-index: 10000; }
        .action-btn { font-size: 1.3rem; color: var(--card-bg); background: var(--primary); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(15, 23, 42, 0.2); border: none; }
        .action-btn:hover { transform: translateY(-3px); background: var(--accent); }
        @media (min-width: 768px) { .action-btn { width: 60px; height: 60px; font-size: 1.5rem; } }

        .nav-links { position: fixed; top: 0; right: -100%; width: 100%; max-width: 350px; height: 100vh; background: var(--primary); color: white; box-shadow: -10px 0 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; padding-top: 100px; transition: right 0.4s ease; z-index: 9997; }
        .nav-links.active { right: 0; }
        .nav-links a { color: white; text-decoration: none; font-weight: 700; padding: 20px 40px; font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .nav-links a:hover { background: var(--accent); padding-left: 50px; }

        .container { max-width: 900px; margin: 0 auto; padding: 120px 20px 50px 20px; text-align: center;}
        @media (min-width: 768px) { .container { padding: 150px 40px 60px 40px; } }

        .back-btn { display: inline-block; background: var(--primary); color: white; padding: 12px 30px; border-radius: 50px; text-decoration: none; font-weight: 700; margin-bottom: 40px; transition: 0.3s; border: none;}
        .back-btn:hover { background: var(--accent); transform: translateY(-2px); }

        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 40px 30px; box-shadow: var(--shadow-soft); border: 1px solid #e2e8f0; border-top: 6px solid var(--accent); text-align: left;}
        .card h1 { font-family: 'Playfair Display', serif; color: var(--primary); font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 15px 0; font-weight: 900; }
        .card p { color: var(--text-muted); font-size: 1.1rem; margin: 0; line-height: 1.8;}

        footer { background: var(--primary); color: #94a3b8; text-align: center; padding: 3rem 20px; margin-top: 4rem; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="action-btn" id="hamburger-icon" aria-label="Toggle Menu" onclick="toggleMenu()">&#9776;</button>
    </div>

    <nav class="nav-links" id="navLinks">
        <a href="index.html">🏠 HOME</a>
        <a href="inauguration.html">🚀 DIGITAL LAUNCH</a>
        <a href="index.html#academics">Academics</a>
        <a href="index.html#staff-directory">Staff Directory</a>
    </nav>

    <div class="container">
        <a href="index.html" class="back-btn">⬅ Back to Home</a>
        
        <div class="card">
            <h1 id="activity-title">Loading Details...</h1>
            <p id="activity-desc">Please wait while we fetch the specific details for this curriculum or club.</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 GVHSS Moolamattom. Built by <strong style="color: white;">Alan Martin</strong></p>
    </footer>

    <script>
        function toggleMenu() {
            const nav = document.getElementById("navLinks");
            nav.classList.toggle("active");
        }

        // Dynamic Content Logic
        const contentData = {
            'class8': { title: 'Class 8 Syllabus', desc: 'Our Class 8 curriculum introduces students to a broader range of state syllabus subjects, focusing on critical thinking, basic sciences, mathematics, and regional languages to build a strong high school foundation.' },
            'class9': { title: 'Class 9 Syllabus', desc: 'Class 9 acts as the crucial preparatory stage for board exams. We intensify focus on analytical subjects, social sciences, and language literature to prepare students for the challenges of 10th standard.' },
            'class10': { title: 'Class 10 Syllabus', desc: 'The defining year. Our expert faculty provides rigorous board exam coaching, special revision camps, and continuous assessments to ensure our historic 100% pass rate is maintained.' },
            
            'webdev': { title: 'Web Developer Stream', desc: 'A cutting-edge vocational course teaching HTML, CSS, JavaScript, and backend logic. Students graduate ready to build modern websites, digital applications, and enter the IT workforce.' },
            'dietetic': { title: 'Dietetic Aid', desc: 'Focused on health and nutrition, this course prepares students for careers in healthcare, hospitals, and wellness centers by teaching the science of dietary planning and patient care.' },
            'ltpm': { title: 'LTPM', desc: 'Livestock Management and Poultry Production is a highly practical vocational stream teaching modern, sustainable agricultural and farming practices for economic independence.' },
            
            'jrc': { title: 'Junior Red Cross (JRC)', desc: 'Instilling humanitarian values. Students in JRC learn first aid, disaster management, and the importance of selfless service to the community.' },
            'kites': { title: 'Little Kites', desc: 'Kerala Infrastructure and Technology for Education (KITE). This club empowers students with advanced IT skills, hardware knowledge, and open-source software mastery.' },
            'nature': { title: 'Nature Club', desc: 'Dedicated to preserving our environment. Members participate in tree planting, plastic-free campaigns, and organic farming on campus.' },
            'yip-hs': { title: 'Young Innovators Programme', desc: 'Fostering the next generation of inventors. Students identify real-world problems and design technological or social solutions.' },
            
            'nss': { title: 'National Service Scheme', desc: '"Not me but you." The NSS unit is the backbone of our community outreach, organizing rural camps, blood donation drives, and civic awareness programs.' },
            'ojt': { title: 'On-the-Job Training (OJT)', desc: 'Real-world experience is vital. Our vocational students are placed in professional environments to gain practical industry exposure before they even graduate.' },
            'fieldvisit': { title: 'Field Visits', desc: 'Education beyond the classroom. Regular visits to industries, ecological sites, and historical monuments provide context to theoretical learning.' },
            'career': { title: 'Career Guidance', desc: 'Expert counseling cells to help students identify their passions, understand higher education opportunities, and prepare for entrance examinations.' }
        };

        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const itemKey = urlParams.get('item');
            
            const titleEl = document.getElementById('activity-title');
            const descEl = document.getElementById('activity-desc');

            if (itemKey && contentData[itemKey]) {
                titleEl.textContent = contentData[itemKey].title;
                descEl.textContent = contentData[itemKey].desc;
            } else {
                titleEl.textContent = "Information Not Found";
                descEl.textContent = "It looks like you navigated to an invalid page or the content is currently being updated. Please return to the homepage.";
            }
        });
    </script>
</body>
</html>
