<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Inauguration - GVHSS Moolamattom</title>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@700;900&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --gold: #ffc107;
            --dark-green: #051f08;
            --neon-green: #39ff14;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-green);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            /* Subtle star background */
            background-image: radial-gradient(circle at center, #114216 0%, #051f08 100%);
        }

        /* Initial Launch Button */
        #launch-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .launch-btn {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: #111;
            font-size: 1.8rem;
            font-weight: 900;
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: transform 0.3s, box-shadow 0.3s;
            animation: pulseGlow 2s infinite;
        }

        .launch-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 193, 7, 0.9);
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(255, 193, 7, 0.4); }
            50% { box-shadow: 0 0 50px rgba(255, 193, 7, 1); }
            100% { box-shadow: 0 0 20px rgba(255, 193, 7, 0.4); }
        }

        /* Cinematic Countdown */
        #countdown-screen {
            display: none;
            font-size: 15rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 50px rgba(255, 193, 7, 0.8);
            z-index: 10;
        }

        .zoom-punch {
            animation: punch 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes punch {
            0% { transform: scale(0.1); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Screen Flash Effect */
        #flash {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: white;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
        }

        .flash-anim {
            animation: flashbang 1.5s ease-out forwards;
        }

        @keyframes flashbang {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Final Grand Reveal Screen */
        #reveal-screen {
            display: none;
            z-index: 10;
            flex-direction: column;
            align-items: center;
        }

        .reveal-title {
            font-family: 'Manjari', sans-serif;
            font-size: 5rem;
            color: var(--gold);
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255, 193, 7, 0.8), 2px 2px 10px rgba(0,0,0,0.8);
            margin: 0;
            line-height: 1.1;
        }

        .reveal-subtitle {
            font-size: 2rem;
            color: #fff;
            margin-top: 15px;
            letter-spacing: 5px;
            background: var(--savage-red);
            padding: 5px 30px;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(213, 0, 0, 0.8);
        }

        .enter-site-btn {
            margin-top: 40px;
            background: transparent;
            color: var(--gold);
            border: 3px solid var(--gold);
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .enter-site-btn:hover {
            background: var(--gold);
            color: #111;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.6);
        }

    </style>
</head>
<body>

    <audio id="bgMusic" src="assets/bg.mp3" loop></audio>
    <audio id="crackerSound" src="assets/cracker.mp3"></audio>

    <div id="launch-container">
        <h2 style="color: #fff; font-family: 'Manjari'; letter-spacing: 2px; margin-bottom: 30px;">TEAM SAVAGE PRESENTS</h2>
        <button class="launch-btn" onclick="startInauguration()">✂️ Initiate Grand Launch</button>
    </div>

    <div id="countdown-screen">5</div>

    <div id="flash"></div>

    <div id="reveal-screen">
        <h1 class="reveal-title">GVHSS<br>MOOLAMATTOM</h1>
        <div class="reveal-subtitle">DIGITAL HUB OFFICIALLY OPEN</div>
        <a href="index.html" class="enter-site-btn">Enter Website 🚀</a>
    </div>

    <script>
        let count = 5;
        const launchContainer = document.getElementById('launch-container');
        const countdownScreen = document.getElementById('countdown-screen');
        const revealScreen = document.getElementById('reveal-screen');
        const flashScreen = document.getElementById('flash');
        
        const bgMusic = document.getElementById('bgMusic');
        const crackerSound = document.getElementById('crackerSound');

        function startInauguration() {
            // Start background music immediately
            bgMusic.play();

            // Switch UI
            launchContainer.style.display = 'none';
            countdownScreen.style.display = 'block';

            // Trigger the first number animation
            countdownScreen.classList.add('zoom-punch');

            const timer = setInterval(() => {
                count--;

                if (count > 0) {
                    // Reset and re-trigger animation
                    countdownScreen.classList.remove('zoom-punch');
                    void countdownScreen.offsetWidth; // Trigger reflow
                    countdownScreen.innerText = count;
                    countdownScreen.classList.add('zoom-punch');
                } else if (count === 0) {
                    // Play Cracker Sound
                    crackerSound.currentTime = 0;
                    crackerSound.play();
                } else {
                    clearInterval(timer);
                    triggerGrandReveal();
                }
            }, 1000);
        }

        function triggerGrandReveal() {
            countdownScreen.style.display = 'none';
            
            // Trigger Flash
            flashScreen.classList.add('flash-anim');

            // Show Final Screen
            revealScreen.style.display = 'flex';

            // Launch Epic Fireworks
            fireworksShow();
        }

        function fireworksShow() {
            const duration = 15 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                
                // Fire from multiple random spots
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                    colors: ['#ffc107', '#ff0000', '#00ff00']
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                    colors: ['#ffc107', '#ffffff', '#ff9800']
                }));
            }, 250);
        }
    </script>
</body>
</html>
