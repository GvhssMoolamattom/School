<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GVHSS Moolamattom</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #114216;
            --accent-gold: #ffc107;
            --savage-red: #d50000;
            --bg-light: #f4f6f8;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: #333;
        }

        header {
            background: var(--primary-green);
            color: #fff;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--accent-gold);
            font-weight: 800;
        }

        .logout-btn {
            background: var(--savage-red);
            color: #fff;
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .logout-btn:hover { opacity: 0.9; }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .admin-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .admin-card h2 {
            margin-top: 0;
            color: var(--primary-green);
            font-size: 1.3rem;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #4a5568;
        }

        textarea, input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus, input[type="text"]:focus {
            border-color: var(--accent-gold);
        }

        .save-btn {
            background: var(--primary-green);
            color: var(--accent-gold);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .save-btn:hover {
            background: #0b3d0b;
        }

        /* Gallery Grid Controls */
        .gallery-upload-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .gallery-upload-item {
            background: #f8fafc;
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .gallery-preview {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #e2e8f0;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary-green);
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: none;
            font-weight: 600;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <header>
        <h1>GVHSS Moolamattom — Admin Portal</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <div class="container">
        
        <div class="admin-card">
            <h2>School Overview Text</h2>
            <div class="form-group">
                <label for="aboutInput">Main Hero Description</label>
                <textarea id="aboutInput" rows="3" placeholder="Enter school summary description..."></textarea>
            </div>
            <button class="save-btn" onclick="saveAbout()">Update Overview 🚀</button>
        </div>

        <div class="admin-card">
            <h2>Manage Campus Gallery Images</h2>
            <div class="gallery-upload-grid">
                
                <div class="gallery-upload-item">
                    <h4>Slot 1</h4>
                    <img id="prev-gal-1" class="gallery-preview" src="assets/gallery1.png" alt="Preview 1">
                    <input type="file" id="file-gal-1" accept="image/*" onchange="uploadImage(event, 'gal-1', 'prev-gal-1')">
                </div>

                <div class="gallery-upload-item">
                    <h4>Slot 2</h4>
                    <img id="prev-gal-2" class="gallery-preview" src="assets/gallery2.png" alt="Preview 2">
                    <input type="file" id="file-gal-2" accept="image/*" onchange="uploadImage(event, 'gal-2', 'prev-gal-2')">
                </div>

                <div class="gallery-upload-item">
                    <h4>Slot 3</h4>
                    <img id="prev-gal-3" class="gallery-preview" src="assets/gallery3.png" alt="Preview 3">
                    <input type="file" id="file-gal-3" accept="image/*" onchange="uploadImage(event, 'gal-3', 'prev-gal-3')">
                </div>

                <div class="gallery-upload-item">
                    <h4>Slot 4</h4>
                    <img id="prev-gal-4" class="gallery-preview" src="assets/gallery4.png" alt="Preview 4">
                    <input type="file" id="file-gal-4" accept="image/*" onchange="uploadImage(event, 'gal-4', 'prev-gal-4')">
                </div>

            </div>
        </div>

    </div>

    <div class="toast" id="toast">Saved Successfully!</div>

    <script>
        // Guard check for admin login
        if (localStorage.getItem('isAdmin') !== 'true') {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('isAdmin');
            window.location.href = 'login.html';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        // Load existing content on startup
        window.onload = function() {
            document.getElementById('aboutInput').value = localStorage.getItem('about-text') || '';
            
            for (let i = 1; i <= 4; i++) {
                const savedImg = localStorage.getItem(`gal-${i}`);
                if (savedImg) {
                    document.getElementById(`prev-gal-${i}`).src = savedImg;
                }
            }
        };

        function saveAbout() {
            const text = document.getElementById('aboutInput').value.trim();
            localStorage.setItem('about-text', text);
            showToast('Overview text updated!');
        }

        // Handle Image Upload and save to LocalStorage as DataURL
        function uploadImage(event, storageKey, previewId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageDataUrl = e.target.result;
                // Save base64 string to local storage
                localStorage.setItem(storageKey, imageDataUrl);
                // Update local preview
                document.getElementById(previewId).src = imageDataUrl;
                showToast('Image uploaded and updated live on website!');
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
