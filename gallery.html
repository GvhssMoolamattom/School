    <style>
        /* --- ULTRA LIQUID GLASS ONAM PALETTE --- */
        :root {
            --onam-green: #0a4a25;       
            --onam-light-green: #157a3e; 
            --onam-yellow: #FFD700;      
            --onam-gold: #FFB300;        
            --maroon: #8b0000;           
            --text-dark: #1a1a1a;        
            
            --liquid-bg: rgba(255, 255, 255, 0.25); 
            --liquid-border-light: rgba(255, 255, 255, 0.8);
            --liquid-border-dark: rgba(255, 255, 255, 0.2);
            --liquid-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            --liquid-inner-glow: inset 0 0 30px rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 0; line-height: 1.7; color: var(--text-dark);
            background: linear-gradient(-45deg, #a8e063, #fdfbf7, #ffd700, #56ab2f);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            background-attachment: fixed;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .mala-top { position: fixed; top: 0; left: 0; width: 100%; height: clamp(50px, 8vw, 100px); background-image: url('assets/mala-top.png'); background-repeat: repeat-x; background-size: contain; background-position: top center; z-index: 9999; pointer-events: none; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3)); }
        .mala-left { position: fixed; top: 0; left: 0; height: 100vh; width: clamp(25px, 6vw, 80px); background-image: url('assets/mala-side.png'); background-repeat: repeat-y; background-size: contain; z-index: 9998; pointer-events: none; filter: drop-shadow(5px 0 15px rgba(0,0,0,0.3)); }
        .mala-right { position: fixed; top: 0; right: 0; height: 100vh; width: clamp(25px, 6vw, 80px); background-image: url('assets/mala-side.png'); background-repeat: repeat-y; background-size: contain; background-position: right; z-index: 9998; pointer-events: none; filter: drop-shadow(-5px 0 15px rgba(0,0,0,0.3)); }

        .main-wrapper { padding-top: clamp(80px, 12vw, 140px); padding-left: clamp(40px, 8vw, 100px); padding-right: clamp(40px, 8vw, 100px); padding-bottom: 40px; max-width: 1400px; margin: 0 auto; box-sizing: border-box; }

        #particle-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .glow-mote { position: absolute; top: -10vh; border-radius: 50%; background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 0 15px rgba(255, 215, 0, 0.5), inset 0 0 10px rgba(255,255,255,0.8); backdrop-filter: blur(5px); opacity: 0.6; animation: floatUp linear infinite; }
        @keyframes floatUp { 0% { transform: translateY(110vh) scale(0.5); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }

        .top-bar { position: fixed; top: clamp(15px, 4vw, 25px); right: clamp(35px, 8vw, 100px); z-index: 10000; }
        .hamburger { font-size: clamp(1.5rem, 3vw, 2rem); color: var(--onam-green); background: var(--liquid-bg); backdrop-filter: blur(20px) saturate(150%); border: 1px solid var(--liquid-border-dark); border-top: 2px solid var(--liquid-border-light); border-left: 2px solid var(--liquid-border-light); width: clamp(45px, 6vw, 55px); height: clamp(45px, 6vw, 55px); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: var(--liquid-shadow); }
        .hamburger:hover { transform: scale(1.1); background: rgba(255,255,255,0.5); box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5); }

        .nav-links { position: fixed; top: 0; right: -100%; width: clamp(260px, 80vw, 300px); height: 100vh; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%); box-shadow: -10px 0 40px rgba(0,0,0,0.2), inset 10px 0 30px rgba(255,255,255,0.5); border-left: 2px solid var(--liquid-border-light); display: flex; flex-direction: column; padding-top: 100px; transition: right 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 9997; }
        .nav-links.active { right: 0; }
        .nav-links a { color: var(--onam-green); text-decoration: none; font-weight: 900; padding: 15px 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.3); transition: 0.3s; text-shadow: 0 2px 5px rgba(255,255,255,0.8); }
        .nav-links a:hover { background: rgba(255, 255, 255, 0.5); padding-left: 40px; color: var(--maroon); }

        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .ultra-glass { background: var(--liquid-bg); backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%); border: 1px solid var(--liquid-border-dark); border-top: 2px solid var(--liquid-border-light); border-left: 2px solid var(--liquid-border-light); box-shadow: var(--liquid-shadow), var(--liquid-inner-glow); border-radius: 30px; position: relative; z-index: 1; }

        .section-title { font-family: 'Playfair Display', serif; color: var(--onam-green); font-size: clamp(2rem, 5vw, 3rem); margin-top: 0; border-bottom: 2px solid rgba(255,255,255,0.6); padding-bottom: 10px; display: inline-block; margin-bottom: 25px; text-shadow: 0 2px 15px rgba(255,255,255,0.8); }

        .back-btn:hover { background: rgba(10, 74, 37, 0.9); transform: scale(1.05); }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-top: 20px;}
        .gallery-item { width: 100%; height: clamp(150px, 20vw, 220px); object-fit: cover; border-radius: 20px; border-top: 3px solid rgba(255,255,255,0.9); border-left: 3px solid rgba(255,255,255,0.9); border-bottom: 1px solid rgba(0,0,0,0.1); border-right: 1px solid rgba(0,0,0,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.1); transition: 0.4s cubic-bezier(0.25, 1, 0.5, 1); cursor: pointer; }

        }

        .modal-content {

            width: auto; max-width: 90%; max-height: 80vh;
            border-radius: 20px;
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 50px rgba(0,0,0,0.5), 0 0 30px rgba(255, 215, 0, 0.2);

        .close {

        }

    <!-- JAVASCRIPT -->
    <script>
        function toggleMenu() {
            const nav = document.getElementById("navLinks");
            const icon = document.getElementById("hamburger-icon");
            nav.classList.toggle("active");
            icon.innerHTML = nav.classList.contains("active") ? "&times;" : "&#9776;"; 
        }

        // Modal Functionality
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("img01");

        function closeModal() {
            modal.style.display = "none";
        }

        // Close modal when clicking anywhere outside the image
        modal.addEventListener('click', function(e) {
            if (e.target !== modalImg) {
                closeModal();
            }
        });

        document.addEventListener("DOMContentLoaded", function() {
            // Scroll Reveal Logic
            const reveals = document.querySelectorAll(".reveal");
            function revealOnScroll() {
                let windowHeight = window.innerHeight;
                let elementVisible = 80;
                reveals.forEach(reveal => {
                    let elementTop = reveal.getBoundingClientRect().top;
                    if (elementTop < windowHeight - elementVisible) {
                        reveal.classList.add("active");
                    }
                });
            }
            window.addEventListener("scroll", revealOnScroll);
            revealOnScroll(); 

            // Make all gallery images open the modal
            const galleryImages = document.querySelectorAll('.gallery-item');
            galleryImages.forEach(img => {
                img.addEventListener('click', function() {
                    modal.style.display = "flex"; // Use flex to center perfectly
                    modalImg.src = this.src; // Get the source of the clicked image
                });
            });

            // Glowing Particles
            const particleContainer = document.getElementById('particle-container');
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 25; i++) {
                let particle = document.createElement('div');
                particle.classList.add('glow-mote');
                let size = Math.random() * 8 + 4; 
                let posX = Math.random() * 100; 
                let duration = Math.random() * 15 + 10; 
                let delay = Math.random() * 10; 
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = posX + 'vw';
                particle.style.animationDuration = duration + 's';
                particle.style.animationDelay = delay + 's';
                fragment.appendChild(particle);
            }
            particleContainer.appendChild(fragment);
        });
    </script>
