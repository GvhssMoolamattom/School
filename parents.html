<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents Portal | GVHSS Moolamattom</title>
    <style>
        :root { --primary-color: #2C3E50; --accent-color: #FF6B6B; --button-color: #4ECDC4; --text-main: #333333; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            background-attachment: fixed; min-height: 100vh; display: flex; flex-direction: column;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        nav { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); padding: 1rem; text-align: center; }
        nav a { color: var(--primary-color); text-decoration: none; font-weight: 700; background: rgba(255,255,255,0.5); padding: 8px 20px; border-radius: 20px; transition: all 0.3s; }
        nav a:hover { background: var(--accent-color); color: white; transform: scale(1.05); }

        .container { flex: 1; max-width: 600px; margin: 3rem auto; padding: 1rem; width: 100%; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            border-radius: 25px; padding: 3rem; border-top: 8px solid var(--accent-color);
        }

        h2 { color: var(--primary-color); text-align: center; margin-top: 0; }
        
        /* Form Styling */
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; color: var(--primary-color); display: block; margin-bottom: 5px; }
        input, textarea {
            width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #ddd;
            box-sizing: border-box; font-family: inherit; font-size: 1rem;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--button-color); }
        
        button {
            width: 100%; background: var(--primary-color); color: white; padding: 15px;
            border: none; border-radius: 30px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s; margin-top: 10px;
        }
        button:hover { background: var(--button-color); transform: translateY(-3px); }

        #success-msg { display: none; color: green; font-weight: bold; text-align: center; margin-top: 15px; background: #e8f5e9; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">⬅ Back to Home</a>
    </nav>

    <div class="container">
        <div class="glass-panel">
            <h2>👨‍👩‍👧‍👦 Parents Suggestion Box</h2>
            <p style="text-align: center;">We value your feedback to help our school grow!</p>
            
            <div class="form-group">
                <label>Parent's Name:</label>
                <input type="text" id="parentName" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Student's Name & Class:</label>
                <input type="text" id="studentName" placeholder="E.g. Rahul - 10th Standard" required>
            </div>
            <div class="form-group">
                <label>Your Suggestion / Message:</label>
                <textarea id="suggestionText" rows="5" placeholder="Type your suggestion here..." required></textarea>
            </div>
            <button onclick="submitSuggestion()">Submit Suggestion</button>

            <div id="success-msg">✅ Thank you! Your suggestion has been sent to the administration.</div>
        </div>
    </div>

    <script>
        function submitSuggestion() {
            const pName = document.getElementById('parentName').value;
            const sName = document.getElementById('studentName').value;
            const msg = document.getElementById('suggestionText').value;

            if(pName === "" || msg === "") {
                alert("Please fill in your name and suggestion.");
                return;
            }

            // Create a suggestion object
            const newSuggestion = { parent: pName, student: sName, text: msg, date: new Date().toLocaleDateString() };

            // Get existing suggestions from browser memory, or start an empty list
            let suggestions = JSON.parse(localStorage.getItem('school_suggestions')) || [];
            suggestions.push(newSuggestion);

            // Save back to browser memory
            localStorage.setItem('school_suggestions', JSON.stringify(suggestions));

            // Show success and clear form
            document.getElementById('success-msg').style.display = 'block';
            document.getElementById('parentName').value = '';
            document.getElementById('studentName').value = '';
            document.getElementById('suggestionText').value = '';
            
            setTimeout(() => { document.getElementById('success-msg').style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
