<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GVHSS Moolamattom</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary-green: #114216; --accent-gold: #ffc107; --savage-red: #d50000; --bg-light: #f4f6f8; }
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background-color: var(--bg-light); color: #333; }
        header { background: var(--primary-green); color: #fff; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        header h1 { margin: 0; font-size: 1.4rem; color: var(--accent-gold); font-weight: 800; }
        .logout-btn { background: var(--savage-red); color: #fff; padding: 8px 18px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .admin-card { background: #ffffff; border-radius: 16px; padding: 30px; margin-bottom: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .admin-card h2 { margin-top: 0; color: var(--primary-green); font-size: 1.3rem; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #4a5568; }
        textarea, input[type="text"], input[type="email"], input[type="file"] { width: 100%; padding: 12px; border: 2px solid #cbd5e0; border-radius: 8px; font-family: inherit; font-size: 0.95rem; box-sizing: border-box; outline: none; }
        textarea:focus, input[type="text"]:focus { border-color: var(--accent-gold); }
        .help-text { font-size: 0.8rem; color: #718096; margin-top: 5px; }
        
        .btn { border: none; padding: 12px 25px; border-radius: 8px; font-weight: 800; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
        .save-btn { background: var(--primary-green); color: var(--accent-gold); }
        .save-btn:hover { background: #0b3d0b; }
        .add-btn { background: var(--accent-gold); color: #111; padding: 6px 15px; font-size: 0.85rem; border-radius: 20px; }
        .remove-btn { background: #fee2e2; color: #b91c1c; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; margin-top: 10px; width: 100%; border: none; cursor: pointer; font-weight: 700; }

        /* Dynamic Gallery Grid */
        .gallery-upload-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .gallery-upload-item { background: #f8fafc; border: 2px dashed #cbd5e0; border-radius: 12px; padding: 15px; text-align: center; position: relative; }
        .gallery-preview { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: #e2e8f0; }

        /* Parent Messages */
        .message-box { background: #f1f8f1; padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary-green); margin-bottom: 15px; }
        .message-box h4 { margin: 0 0 5px 0; color: var(--primary-green); }
        .message-box span { font-size: 0.85rem; color: #555; }
        .message-box p { margin: 10px 0 0 0; font-size: 0.95rem; }

        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--primary-green); color: #fff; padding: 12px 25px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: none; font-weight: 600; z-index: 9999; }
    </style>
</head>
<body>

    <header>
        <h1>GVHSS Moolamattom — Admin Portal</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <div class="container">
        
        <div class="admin-card">
            <h2>Parents Portal Feedback / Suggestions</h2>
            <div id="parentMessagesList">
                </div>
        </div>

        <div class="admin-card">
            <h2>Manage Notice Boards</h2>
            <div class="form-group">
                <label for="hsNotices">High School Notices</label>
                <textarea id="hsNotices" rows="4" placeholder="<li>Sample Notice 1</li>"></textarea>
                <div class="help-text">Wrap each notice in &lt;li&gt; and &lt;/li&gt; tags.</div>
            </div>
            <div class="form-group">
                <label for="vhssNotices">VHSS (Vocational) Notices</label>
                <textarea id="vhssNotices" rows="4" placeholder="<li>Sample Notice 1</li>"></textarea>
                <div class="help-text">Wrap each notice in &lt;li&gt; and &lt;/li&gt; tags.</div>
            </div>
            <button class="btn save-btn" onclick="saveNotices()">Update Notices 🚀</button>
        </div>

        <div class="admin-card">
            <h2>
                Manage Campus Gallery 
                <button class="btn add-btn" onclick="addGallerySlot()">+ Add New Image Slot</button>
            </h2>
            <div class="gallery-upload-grid" id="gallery-upload-grid">
                </div>
        </div>

    </div>

    <div class="toast" id="toast">Saved Successfully!</div>

    <script>
        // Guard check for admin login
        if (localStorage.getItem('isAdmin') !== 'true') { window.location.href = 'login.html'; }
        function logout() { localStorage.removeItem('isAdmin'); window.location.href = 'login.html'; }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        // --- GLOBAL ARRAYS ---
        let galleryArr = JSON.parse(localStorage.getItem('dynamic-gallery')) || [
            'assets/gallery1.png', 'assets/gallery2.png', 'assets/gallery3.png', 'assets/gallery4.png'
        ];

        window.onload = function() {
            // Load Notices
            document.getElementById('hsNotices').value = localStorage.getItem('hs-notices') || '';
            document.getElementById('vhssNotices').value = localStorage.getItem('vhss-notices') || '';
            
            // Load Parent Messages
            loadParentMessages();
            // Load Gallery Grid
            renderAdminGallery();
        };

        // --- PARENT MESSAGES LOGIC ---
        function loadParentMessages() {
            const messages = JSON.parse(localStorage.getItem('parent-messages')) || [];
            const container = document.getElementById('parentMessagesList');
            if(messages.length === 0) {
                container.innerHTML = '<p style="color:#777;">No suggestions submitted from parents yet.</p>';
                return;
            }
            container.innerHTML = messages.map(msg => `
                <div class="message-box">
                    <h4>${msg.name}</h4>
                    <span>Contact: ${msg.contact} | Date: ${msg.date}</span>
                    <p>${msg.suggestion}</p>
                </div>
            `).join('');
        }

        // --- NOTICES LOGIC ---
        function saveNotices() {
            localStorage.setItem('hs-notices', document.getElementById('hsNotices').value.trim());
            localStorage.setItem('vhss-notices', document.getElementById('vhssNotices').value.trim());
            showToast('Notice Boards updated!');
        }

        // --- DYNAMIC GALLERY LOGIC ---
        function renderAdminGallery() {
            const container = document.getElementById('gallery-upload-grid');
            container.innerHTML = '';
            galleryArr.forEach((src, index) => {
                container.innerHTML += `
                    <div class="gallery-upload-item">
                        <h4 style="margin:0 0 10px 0; color:#4a5568;">Image ${index + 1}</h4>
                        <img class="gallery-preview" src="${src}" alt="Preview ${index + 1}">
                        <input type="file" accept="image/*" onchange="handleDynamicUpload(event, ${index})">
                        <button class="remove-btn" onclick="removeGallerySlot(${index})">❌ Remove</button>
                    </div>
                `;
            });
        }

        function addGallerySlot() {
            // Adds a placeholder image until they upload a new one
            galleryArr.push('https://via.placeholder.com/300x200?text=Upload+New+Image'); 
            localStorage.setItem('dynamic-gallery', JSON.stringify(galleryArr));
            renderAdminGallery();
        }

        function removeGallerySlot(index) {
            if(confirm("Are you sure you want to remove this gallery image?")) {
                galleryArr.splice(index, 1);
                localStorage.setItem('dynamic-gallery', JSON.stringify(galleryArr));
                renderAdminGallery();
            }
        }

        function handleDynamicUpload(event, index) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                galleryArr[index] = e.target.result;
                localStorage.setItem('dynamic-gallery', JSON.stringify(galleryArr));
                renderAdminGallery();
                showToast('Image uploaded & added to Gallery!');
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
